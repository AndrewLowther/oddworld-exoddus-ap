name: Release APWorld

on:
  push:
    tags:
      - "v*"          # runs when you push a tag like v0.1.0

permissions:
  contents: write     # needed to create the release; nothing else

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the world version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WORLD=$(python -c "import json; print(json.load(open('apworld/oddworld_exoddus/archipelago.json'))['world_version'])")
          echo "tag=$TAG world=$WORLD"
          test "$TAG" = "$WORLD"

      - name: Build the .apworld
        run: |
          cd apworld
          zip -r ../oddworld_exoddus.apworld oddworld_exoddus \
            -x "*/__pycache__/*" "*.pyc" "oddworld_exoddus/test/*"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: oddworld_exoddus.apworld
          generate_release_notes: true